name: Bug report
description: Report a reproducible Speedy Cafe problem using only fictional test data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload customer records, passwords, database backups, payment details or security exploits. Report sensitive issues privately."
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Fictional browser demo
        - Local Docker (localhost)
        - Hosted isolated cafe
        - Unknown
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Steps to reproduce using fictional data
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "main / commit ID"
